<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SlimPanel</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="login" class="screen">
    <form id="login-form" class="card login-card">
      <h1>SlimPanel</h1>
      <label>Username <input name="username" autocomplete="username" required></label>
      <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
      <label>2FA code <input name="code" inputmode="numeric" placeholder="optional"></label>
      <button type="submit">Sign in</button>
      <p id="login-error" class="error"></p>
    </form>
  </div>

  <div id="app" class="screen hidden">
    <aside>
      <div class="brand">SlimPanel</div>
      <nav id="nav"></nav>
      <button id="logout" class="ghost">Sign out</button>
    </aside>
    <main>
      <header>
        <h2 id="view-title">Overview</h2>
        <span id="whoami" class="muted"></span>
      </header>
      <section id="view"></section>
    </main>
  </div>

  <div id="toast" class="toast hidden"></div>
  <script src="app.js"></script>
</body>
</html>
